name: Update PostHog Downloads insight
on:
  release:
    types: [published]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-posthog:
    runs-on: ubuntu-latest
    steps:
      - name: Sync downloads from GitHub
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, urllib.request as u, os, sys
          
          headers = {"User-Agent": "Amplitron-Action"}
          if os.environ.get("GITHUB_TOKEN"):
              headers["Authorization"] = f"Bearer {os.environ['GITHUB_TOKEN']}"
          
          try:
              req = u.Request("https://api.github.com/repos/sudip-mondal-2002/Amplitron/releases", headers=headers)
              r = json.loads(u.urlopen(req).read())
          except Exception as e:
              print(f"Failed to fetch releases: {e}")
              sys.exit(1)
              
          if isinstance(r, dict) and "message" in r:
              print(f"GitHub API Error: {r['message']}")
              sys.exit(1)
              
          l = sum(a.get("download_count", 0) for x in r if isinstance(x, dict) for a in x.get("assets", []) if "Linux" in a.get("name", ""))
          m = sum(a.get("download_count", 0) for x in r if isinstance(x, dict) for a in x.get("assets", []) if "macOS" in a.get("name", ""))
          w = sum(a.get("download_count", 0) for x in r if isinstance(x, dict) for a in x.get("assets", []) if "Windows" in a.get("name", ""))
          
          sql = f"SELECT 'Linux' AS operating_system, {l} AS download_count UNION ALL SELECT 'macOS' AS operating_system, {m} AS download_count UNION ALL SELECT 'Windows' AS operating_system, {w} AS download_count"
          
          p = json.dumps({"query": {"kind": "DataVisualizationNode", "source": {"kind": "HogQLQuery", "query": sql}}}).encode()
          
          posthog_key = os.environ.get("POSTHOG_API_KEY")
          if not posthog_key:
              print("POSTHOG_API_KEY is not set. Skipping PostHog update.")
              sys.exit(0)
              
          try:
              posthog_req = u.Request("https://us.posthog.com/api/projects/355360/insights/7587728/", data=p, headers={"Authorization": "Bearer " + posthog_key, "Content-Type": "application/json"}, method="PATCH")
              res = json.loads(u.urlopen(posthog_req).read())
              print("Updated insight:", res.get("name", "Success"))
          except Exception as e:
              print(f"Failed to update PostHog: {e}")
              sys.exit(1)
          EOF
